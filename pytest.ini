[pytest]
markers =
    e2e: end-to-end tests that need the full docker compose stack running
    slow: tests that take a long time (bursts, container restarts)
    destructive: tests that stop containers (need the docker CLI on the host); they restore the stack afterwards
timeout = 60
# fixtures (e.g. waiting for the stack) have their own, longer timeouts
timeout_func_only = true
